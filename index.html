function Reveal({children,className='',delay=0}){
  const r=useRef(null);
  useEffect(()=>{const el=r.current;const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add('in');io.disconnect()}},{threshold:.12});io.observe(el);return()=>io.disconnect()},[]);
  return html`<div ref=${r} className=${'reveal '+className} style=${{transitionDelay:delay+'ms'}}>${children}</div>`;
}

    ${children}
  </section>`;
}

function Background(){
  const c=useRef(null);
  useEffect(()=>{
    const cv=c.current,x=cv.getContext('2d');let w,h,raf,P=[];
    const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const size=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight;P=Array.from({length:Math.min(60,Math.floor(w/22))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};
    const draw=()=>{x.clearRect(0,0,w,h);
      for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle='rgba(99,130,255,.7)';x.fillRect(p.x-1.5,p.y-1.5,3,3)}
      for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle='rgba(120,110,255,'+(.22*(1-d/130))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(a.x,b.y);x.lineTo(b.x,b.y);x.stroke()}}
      if(!reduce)raf=requestAnimationFrame(draw)};
    size();draw();addEventListener('resize',size);
    return()=>{cancelAnimationFrame(raf);removeEventListener('resize',size)};
  },[]);
  return html`<div aria-hidden="true">
    <div className="blob" style=${{width:420,height:420,background:'#3b82f6',top:'-8%',left:'-8%'}}></div>
    <div className="blob" style=${{width:380,height:380,background:'#8b5cf6',bottom:'-10%',right:'-6%',animationDelay:'-6s'}}></div>
    <canvas ref=${c} className="fixed inset-0 z-0 pointer-events-none"></canvas>
  </div>`;
}

  return html`<${Section} id="contact" kicker="Let’s connect" title="Contact">
    <div className="grid md:grid-cols-2 gap-6">
      <${Reveal}><div className="glass p-7 h-full hover:!transform-none">
        <p className="text-slate-300">Open to conversations with professors, recruiters, hackathon teams and fellow learners.</p>
        <ul className="mt-6 space-y-3 text-sm">
          <li><a className="hover:text-white" href=${'mailto:'+LINKS.email}>✉ ${LINKS.email}</a></li>
          <li><a className="hover:text-white" href=${LINKS.linkedin} target="_blank" rel="noopener">in LinkedIn profile</a></li>
          <li><a className="hover:text-white" href=${LINKS.github} target="_blank" rel="noopener">⌥ GitHub profile</a></li>
        </ul>
        <div className="flex gap-3 mt-8">${soc.map(([n,u,d])=>html`<a key=${n} href=${u} target="_blank" rel="noopener" aria-label=${n} className="w-11 h-11 grid place-items-center rounded-full border border-white/15 text-slate-300 hover:text-white hover:border-electric hover:-translate-y-1 transition"><${Svg} d=${d}/></a>`)}</div>
      </div><//>
      <${Reveal} delay=${120}><form onSubmit=${submit} className="glass p-7 space-y-4 hover:!transform-none">
        <label className="block text-sm">Name<input required className="field mt-1" value=${f.name} onChange=${set('name')} autoComplete="name"/></label>
        <label className="block text-sm">Email<input required type="email" className="field mt-1" value=${f.email} onChange=${set('email')} autoComplete="email"/></label>
        <label className="block text-sm">Message<textarea required rows="4" className="field mt-1" value=${f.message} onChange=${set('message')}></textarea></label>
        <button type="submit" className="btn btn-primary w-full">Send Message</button>
      </form><//>
    </div>
  <//>`;
}

function App(){
  const [msg,setMsg]=useState('');
  const toast=m=>{setMsg(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setMsg(''),3500)};
  return html`<div className="relative">
    <${Background}/><${Nav}/>
    <main><${Hero} toast=${toast}/><${About}/><${Education}/><${Skills}/><${Projects}/><${Achievements}/><${Journey}/><${Contact} toast=${toast}/></main>
    <footer className="relative z-10 text-center text-sm text-slate-500 py-10 border-t border-white/5">© ${new Date().getFullYear()} ${PROFILE.name} · Built with React & Tailwind CSS</footer>
    ${msg&&html`<div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 glass !rounded-full px-5 py-3 text-sm text-white hover:!transform-none" style=${{bottom:'calc(env(safe-area-inset-bottom,0px) + 24px)'}}>${msg}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
